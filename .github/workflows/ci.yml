name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - django: "5.2.0"
            python: "3.10"
            django_spec: "Django==5.2.0"
          - django: "5.2.x (latest)"
            python: "3.10"
            django_spec: "Django>=5.2,<5.3"
          - django: "5.2.x (latest)"
            python: "3.14"
            django_spec: "Django>=5.2,<5.3"
          - django: "6.0.0"
            python: "3.12"
            django_spec: "Django==6.0.0"
          - django: "6.0.x (latest)"
            python: "3.12"
            django_spec: "Django>=6.0,<6.1"
          - django: "6.0.x (latest)"
            python: "3.14"
            django_spec: "Django>=6.0,<6.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and Django
        env:
          DJANGO_SPEC: ${{ matrix.django_spec }}
        run: python -m pip install -e . "$DJANGO_SPEC"
      - name: Run integration tests
        run: python -m django test tests --settings=tests.settings

  passed:
    name: CI passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
