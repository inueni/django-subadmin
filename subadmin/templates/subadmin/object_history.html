{% extends "admin/object_history.html" %}
{% load i18n admin_urls admin_filters subadmin_tags %}


{% block breadcrumbs %}
<ol class="breadcrumbs">
{% subadmin_breadcrumbs %}
<li><a href="{% subadmin_url 'changelist' %}">{{ subadmin_label|capfirst }}</a></li>
<li><a href="{% subadmin_url 'change' object.pk|admin_urlquote %}">{{ object|to_object_display_value|truncatewords:"18" }}</a></li>
<li aria-current="page">{% trans 'History' %}</li>
</ol>
{% endblock %}
